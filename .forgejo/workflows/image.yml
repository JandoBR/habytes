name: Image

# Tests the app and the server, builds habitd with the web app embedded, pushes
# it to the registry and puts it live. Only runs when something that ends up in
# the image changed.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "app/**"
      - "!app/android/**"
      - "Dockerfile"
      - ".dockerignore"
      - "flake.*"
      - "scripts/deploy"
      - "scripts/prune-images"
      - ".forgejo/workflows/image.yml"
  workflow_dispatch:

# The runner has Nix installed but not on PATH. NIX_CONFIG avoids the `nixbld`
# group and the sandbox, which the runner does not have.
env:
  IMAGE: registry.example.com/habitd
  NIX_CONFIG: |
    build-users-group =
    sandbox = false
    experimental-features = nix-command flakes

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: pruning orders image tags by commit.
          fetch-depth: 0

      # Nothing below runs, and nothing is deployed, unless the tests pass.
      - name: Test the app
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix develop .#web --command bash -c 'cd app && flutter analyze && flutter test'

      - name: Test the server
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix develop .#server --command bash -c '
            cd server && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          '

      - name: Build the web app
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix develop .#web --command bash -c 'cd app && flutter build web --release'

      - name: Build the image
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push the image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: scripts/deploy

      - name: Prune old images
        run: scripts/prune-images
