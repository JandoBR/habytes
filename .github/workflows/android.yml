name: Android

# Tests the app, builds the signed APK and publishes it as a release. Each
# release has a higher version than the last, so it installs over the previous
# one (and updaters such as Obtainium can follow the releases).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "flake.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  NIX_CONFIG: |
    build-users-group =
    sandbox = false
    experimental-features = nix-command flakes

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 1.0.<run number>: unique and always increasing, which Android needs to
      # accept one build as an update of another. The 36 continues the numbering
      # the Forgejo pipeline reached, so these releases are not downgrades.
      - name: Work out the version
        run: |
          number=$(( GITHUB_RUN_NUMBER + 36 ))
          echo "VERSION=1.0.$number" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"

      # The runner image ships its own Android SDK, .NET and CodeQL databases.
      # None of them are used here, and the Nix build needs the space more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-users-group =
            sandbox = false
            experimental-features = nix-command flakes

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key, so this APK cannot update an installed one."
          fi

      - name: Build and test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cd app
            flutter analyze
            flutter test
            # 64-bit ARM only: every phone since about 2017. The default packs
            # three processor types into one APK, three times the size.
            flutter build apk --release --target-platform android-arm64 \
              --build-name "$VERSION" --build-number "$BUILD_NUMBER"
            cd android
            ./nix-gradlew :app:testDebugUnitTest
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "habytes-$VERSION.apk"
          gh release create "$VERSION" "habytes-$VERSION.apk" \
            --title "$VERSION" \
            --notes "Signed APK built from ${GITHUB_SHA}."
