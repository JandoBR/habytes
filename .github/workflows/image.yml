name: Image

# Tests the app and the server, builds habitd with the web app embedded and
# pushes it to GHCR. Only runs when something that ends up in the image changed.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "app/**"
      - "!app/android/**"
      - "Dockerfile"
      - ".dockerignore"
      - "flake.*"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jandobr/habytes
  NIX_CONFIG: |
    build-users-group =
    sandbox = false
    experimental-features = nix-command flakes

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: pruning orders image tags by commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-users-group =
            sandbox = false
            experimental-features = nix-command flakes

      - name: Test the app
        run: |
          nix develop .#web --command bash -c 'cd app && flutter analyze && flutter test'

      - name: Test the server
        run: |
          nix develop .#server --command bash -c '
            cd server && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          '

      - name: Build the web app
        run: |
          nix develop .#web --command bash -c 'cd app && flutter build web --release'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
